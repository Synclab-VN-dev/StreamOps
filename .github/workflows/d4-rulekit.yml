name: D4 Rule Kit
on:
  push:
    branches:
      - feat/107-d4-rulekit
    paths:
      - 'utility/d4-rulekit/**'
      - '.github/workflows/d4-rulekit.yml'
  pull_request:
    paths:
      - 'utility/d4-rulekit/**'
      - '.github/workflows/d4-rulekit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-contract:
    name: Schema, contract and packaged CLI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install isolated package with test dependencies
        run: python -m pip install -e 'utility/d4-rulekit[dev]'

      - name: Python compile and schema self-check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/d4-rulekit
          python -m compileall -q utility/d4-rulekit/src/d4_rulekit
          d4-rulekit schema-check --report artifacts/d4-rulekit/schema-check.json

      - name: Strict fixture contract validation (positive and negative)
        shell: bash
        run: |
          set -euo pipefail
          d4-rulekit validate utility/d4-rulekit/fixtures/valid/*.json \
            --report artifacts/d4-rulekit/positive.json
          set +e
          d4-rulekit validate utility/d4-rulekit/fixtures/invalid/*.json \
            --report artifacts/d4-rulekit/negative.json
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then
            echo "Expected invalid DSL fixture exit 1, got $rc"
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("artifacts/d4-rulekit/positive.json").read_text())
          n = json.loads(Path("artifacts/d4-rulekit/negative.json").read_text())
          assert p["count"] == 4 and p["status"] == "PASS", p
          assert n["count"] == 4 and n["status"] == "FAIL", n
          assert all(row["status"] == "FAIL" for row in n["results"]), n
          PY

      - name: CI-03 sourced execution contract consistency and golden reference vectors
        shell: bash
        run: |
          set -euo pipefail
          python -m d4_rulekit.contract_check \
            --contract utility/d4-rulekit/contracts/execution-v1.json \
            --references utility/d4-rulekit/references/3.2.3/ci03-reference-vectors.json \
            --report artifacts/d4-rulekit/ci03-contract.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/d4-rulekit/ci03-contract.json").read_text())
          assert report["status"] == "PASS" and report["referenceCount"] >= 4, report
          assert report["gameAccuracy"] == "NOT_VERIFIED_BY_CI03", report
          PY

      - name: Contract unit and CLI integration tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q utility/d4-rulekit/tests \
            --junitxml=artifacts/d4-rulekit/junit.xml

      - name: Build wheel and verify installed package outside repository
        shell: bash
        run: |
          set -euo pipefail
          python -m build --wheel utility/d4-rulekit --outdir "$RUNNER_TEMP/rulekit-wheels"
          python -m venv "$RUNNER_TEMP/rulekit-venv"
          "$RUNNER_TEMP/rulekit-venv/bin/python" -m pip install "$RUNNER_TEMP"/rulekit-wheels/*.whl
          ( cd "$RUNNER_TEMP" && "$RUNNER_TEMP/rulekit-venv/bin/d4-rulekit" schema-check )
          "$RUNNER_TEMP/rulekit-venv/bin/d4-rulekit" validate \
            "$GITHUB_WORKSPACE/utility/d4-rulekit/fixtures/valid/skill.json"

      - name: Upload deterministic reports (including failure evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d4-rulekit-g1-evidence
          path: artifacts/d4-rulekit/
          if-no-files-found: error
          retention-days: 30

  browser-infrastructure:
    name: Persistent Chromium unit and real-headless E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: utility/d4-rulekit/browser-infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: utility/d4-rulekit/browser-infra/package-lock.json

      - name: Install pinned Playwright Core
        run: npm ci

      - name: Install pinned Chromium and Linux dependencies
        run: npx playwright-core install --with-deps chromium

      - name: Resolve pinned Chromium executable
        shell: bash
        run: |
          set -euo pipefail
          chromium_path=$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")
          test -x "$chromium_path"
          echo "BROWSER_INFRA_CHROMIUM_PATH=$chromium_path" >> "$GITHUB_ENV"

      - name: Unit and real headless Chromium E2E
        run: npm test

      - name: Upload browser infrastructure reports (including failure evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d4-rulekit-browser-infrastructure-evidence
          path: utility/d4-rulekit/browser-infra/artifacts/
          if-no-files-found: error
          retention-days: 30

  maxroll-provider:
    name: Maxroll Provider synthetic unit, contract and offline Chromium E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: utility/d4-rulekit/providers/maxroll
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: utility/d4-rulekit/providers/maxroll/package-lock.json

      - name: Install pinned local infrastructure dependency
        run: npm ci

      - name: Install pinned Chromium and Linux dependencies
        run: npx playwright-core install --with-deps chromium

      - name: Resolve pinned Chromium executable
        shell: bash
        run: |
          set -euo pipefail
          chromium_path=$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")
          test -x "$chromium_path"
          echo "BROWSER_INFRA_CHROMIUM_PATH=$chromium_path" >> "$GITHUB_ENV"

      - name: Type declarations, unit, contract and offline synthetic E2E
        run: npm test

      - name: Upload provider reports (including failure evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d4-rulekit-maxroll-provider-evidence
          path: utility/d4-rulekit/providers/maxroll/artifacts/
          if-no-files-found: error
          retention-days: 30
