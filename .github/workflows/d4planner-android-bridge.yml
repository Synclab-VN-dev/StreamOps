name: D4Planner Android Bridge Milestone 1

on:
  pull_request:
    paths:
      - 'utility/d4planner/android/controller-bridge/**'
      - 'scripts/d4planner/issue79/**'
      - '.github/workflows/d4planner-android-bridge.yml'
  workflow_dispatch:

jobs:
  android-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: utility/d4planner/android/controller-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest already includes the Android command-line SDK.
      # setup-android@v3 currently tries to install the obsolete "tools" package.
      - name: Install Android SDK
        run: |
          sdkmanager_bin="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_bin"
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests and APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: issue79-controller-bridge-debug-apk
          path: utility/d4planner/android/controller-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue79-android-unit-test-reports
          path: utility/d4planner/android/controller-bridge/app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14
