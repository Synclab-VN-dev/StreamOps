name: Issue86 owner-approved MagicPath Golden promotion (one-time)

on:
  pull_request:
    paths:
      - ".github/workflows/issue86-promote-approved-goldens-once.yml"

permissions:
  actions: read
  contents: write

jobs:
  promote-reviewed-19-goldens:
    if: >-
      github.event.pull_request.number == 89 &&
      github.event.pull_request.head.repo.full_name == 'Synclab-VN-dev/StreamOps' &&
      github.event.pull_request.head.ref == 'feat/86-game-manager-ws-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/86-game-manager-ws-ui
          persist-credentials: true
      - name: Retrieve exactly the owner-approved 19-reference artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 38063015627
          repository: Synclab-VN-dev/StreamOps
          github-token: ${{ github.token }}
          name: magicpath-visual-509c84546a150dc688ad7419c714e97163902a26
          path: ${{ runner.temp }}/owner-approved-magicpath
      - name: Promote candidate PNGs after strict per-file SHA-256 validation
        env:
          OWNER_APPROVED_ARTIFACT_DIR: ${{ runner.temp }}/owner-approved-magicpath
        run: |
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          import re
          import shutil
          import struct
          from pathlib import Path

          base = Path("streamops/server/tests/visual_magicpath")
          manifest_path = base / "manifest.json"
          manifest = json.loads(manifest_path.read_text("utf-8"))
          approval = manifest["approval"]
          source = approval["candidate"]
          assert source["run_id"] == 38063015627
          assert source["artifact_id"] == 11673783250
          assert source["source_commit"] == "d2f810b3b7a15b3dd77bcae29d758910390e7673"
          assert source["reviewed_screenshots"] == 19
          assert approval["review_url"] == "https://github.com/Synclab-VN-dev/StreamOps/issues/86#issuecomment-6105148279"
          assert manifest["approved"] is False, "Approval promotion can run only once"
          digest_map = approval["expected_sha256"]
          assert len(digest_map) == 19
          assert all(re.fullmatch(r"[0-9a-f]{64}", h) for h in digest_map.values())
          root = Path(os.environ["OWNER_APPROVED_ARTIFACT_DIR"])
          originals = list(root.glob("*/expected-magicpath.png"))
          assert len(originals) == 19, f"Expected 19 source PNGs, got {len(originals)}"
          labels = {p.parent.name for p in originals}
          assert labels == set(digest_map), f"Candidate labels do not match owner-approved manifest: {labels ^ set(digest_map)}"

          out = base / "goldens"
          out.mkdir(exist_ok=True)
          for p in originals:
              label = p.parent.name
              blob = p.read_bytes()
              got = hashlib.sha256(blob).hexdigest()
              assert got == digest_map[label], f"Owner-approved SHA-256 changed: {label}"
              assert blob.startswith(b"\x89PNG\r\n\x1a\n"), f"Not a PNG: {label}"
              width, height = struct.unpack(">II", blob[16:24])
              expected_width, expected_height = map(int, label.rsplit("-", 1)[1].split("x"))
              assert (width, height) == (expected_width, expected_height), f"Wrong viewport for {label}"
              shutil.copyfile(p, out / f"{label}.png")
              print(f"PINNED {label} SHA256={got}")

          approval["approved_by"] = "Project owner — explicit Golden approval in conversation (recorded at review_url)"
          approval["approved_at"] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          approval["reference"] = "Owner-approved immutable MagicPath Golden PNGs; GitHub Actions run 38063015627, artifact 11673783250; each screenshot SHA256 verified"
          manifest["approved"] = True
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          assert {p.stem for p in out.glob("*.png")} == set(digest_map)
          PY
      - name: Commit approved Goldens to FE branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamops/server/tests/visual_magicpath/manifest.json streamops/server/tests/visual_magicpath/goldens
          git diff --cached --quiet && { echo "No Golden change"; exit 1; }
          git commit -m "test(ui): commit 19 owner-approved versioned MagicPath Golden PNGs (#86)"
          git push origin HEAD:refs/heads/feat/86-game-manager-ws-ui
