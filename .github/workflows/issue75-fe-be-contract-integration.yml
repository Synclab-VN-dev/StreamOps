name: Issue75 FE-BE Exact-HEAD Integration
on:
  pull_request:
    paths:
      - 'streamops/server/**'
      - 'pyproject.toml'
      - '.github/workflows/issue75-fe-be-contract-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combined-contract:
    name: Issue75 / FE+BE isolated contract E2E
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      # Canonical PR #52 BE v2 HEAD, deliberately fixed for reproducibility.
      ISSUE75_BE_SHA: '70acbb4037405763e1fc07fa07cd7fd09817257b'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble disposable exact-HEAD integration worktree
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          # PR checkout defaults to a synthetic merge SHA; use the real FE PR HEAD.
          $fe = '${{ github.event.pull_request.head.sha }}'
          if (-not $fe) { $fe = (git rev-parse HEAD).Trim() }
          if (-not $fe) { throw 'Cannot identify FE HEAD' }
          Write-Host "FE HEAD: $fe"
          Write-Host "BE HEAD: $env:ISSUE75_BE_SHA"
          $dir = Join-Path $env:RUNNER_TEMP 'issue75-combined'
          git fetch origin $fe $env:ISSUE75_BE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch fixed BE HEAD' }
          git worktree add --detach $dir $fe
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create isolated worktree' }
          Set-Location $dir
          # This merge is local to a disposable unpushed CI worktree ONLY.
          # A conflict is a real integration failure, never auto-resolved.
          git -c user.name='OpenStream Integration CI' -c user.email='ci@invalid.local' merge --no-commit --no-ff $env:ISSUE75_BE_SHA
          if ($LASTEXITCODE -ne 0) {
            # Resolve only nonproduction CI/workflow overlaps, preserving BOTH
            # versions of the wheel acceptance tests as independently executed
            # contract checks. All other conflicts are real BLOCKERS.
            $conflicts = @(git diff --name-only --diff-filter=U)
            $expected = @('.github/workflows/tests.yml', 'streamops/server/tests/test_wheel_acceptance.py')
            $unexpected = @($conflicts | Where-Object { $_ -notin $expected })
            if ($unexpected.Count -gt 0 -or $conflicts.Count -ne 2) {
              git status --short
              throw "Unexpected FE+BE merge conflicts: $($conflicts -join ', ')"
            }
            $beWheel = 'streamops/server/tests/test_issue75_be_wheel_acceptance_ci.py'
            git show ':3:streamops/server/tests/test_wheel_acceptance.py' |
              Out-File -LiteralPath $beWheel -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw 'Cannot preserve BE wheel acceptance separately' }
            git checkout --ours -- .github/workflows/tests.yml streamops/server/tests/test_wheel_acceptance.py
            if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve isolated CI-only conflicts' }
            git add .github/workflows/tests.yml streamops/server/tests/test_wheel_acceptance.py $beWheel
            if ($LASTEXITCODE -ne 0 -or @(git diff --name-only --diff-filter=U).Count -ne 0) {
              throw 'Unresolved conflicts after isolated CI-only resolution'
            }
            Write-Host 'Both FE and BE wheel contracts preserved; no production conflict suppressed.'
          }
          $combined=(git status --porcelain | Measure-Object).Count
          Write-Host "Temporary uncommitted integration tree, changed entries: $combined"
          "ISSUE75_COMBINED=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated combined dependencies
        shell: pwsh
        run: |
          Set-Location $env:ISSUE75_COMBINED
          python -m pip install '.[server,dev]'
          if ($LASTEXITCODE -ne 0) { throw 'Combined dependencies failed' }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Combined Chromium failed' }
      - name: Run both FE and BE installed-wheel contract checks
        shell: pwsh
        run: |
          Set-Location $env:ISSUE75_COMBINED
          python -m pip wheel . --no-deps -w dist
          if ($LASTEXITCODE -ne 0) { throw 'Combined wheel build failed' }
          $env:STREAMOPS_TEST_WHEEL = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          python -m pytest -q streamops/server/tests/test_wheel_acceptance.py streamops/server/tests/test_issue75_be_wheel_acceptance_ci.py
          if ($LASTEXITCODE -ne 0) { throw 'Combined FE/BE wheel contract drift' }
      - name: FE model, envelopes and fail-closed Unit tests
        shell: pwsh
        run: |
          Set-Location $env:ISSUE75_COMBINED
          node --test streamops/server/tests/issue75_core.test.mjs streamops/server/tests/issue75_store.test.mjs streamops/server/tests/issue75_extended_core.test.mjs streamops/server/tests/issue75_extended_store.test.mjs streamops/server/tests/issue75_wsclient.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'FE models fail on exact FE+BE tree' }
      - name: BE canonical REST-WS parity + FE real browser E2E
        shell: pwsh
        run: |
          Set-Location $env:ISSUE75_COMBINED
          python -m pytest -q --junitxml=$env:RUNNER_TEMP/issue75-combined-junit.xml streamops/server/tests/test_obs_plugin_ws_contract_v2.py streamops/server/tests/test_obs_plugin_api.py streamops/server/tests/test_obs_plugin_adoption.py::test_ad15_rest_and_websocket_adopt_contract scripts/ci/issue75_be_contract_drift.py streamops/server/tests/test_issue75_plugin_ui.py streamops/server/tests/e2e/test_issue75_plugin_manager.py streamops/server/tests/e2e/test_issue75_workflow_matrix.py streamops/server/tests/e2e/test_issue75_recovery_followup.py
          if ($LASTEXITCODE -ne 0) { throw 'Combined contract or FE E2E failed' }
      - name: Preserve integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue75-combined-${{ github.sha }}
          path: ${{ runner.temp }}/issue75-combined-junit.xml
          if-no-files-found: warn
          retention-days: 30
