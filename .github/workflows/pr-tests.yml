name: Tests
on:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    # Keep existing required check context: Tests / windows
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PR module routing self-test
        shell: pwsh
        run: ./scripts/ci/pr-scoped-tests.ps1 -SelfTest
      - name: Run only affected module tests
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/ci/pr-scoped-tests.ps1 -BaseSha $env:BASE_SHA -HeadSha $env:HEAD_SHA
      - name: Upload module-scope evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-scoped-tests-${{ github.sha }}
          path: ${{ runner.temp }}/pr-scoped-tests.json
          if-no-files-found: warn
          retention-days: 14
