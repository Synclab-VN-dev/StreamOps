name: Tests
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[server,dev]'
      - run: python -m pip install -e 'utility/d4planner[dev]'
      - run: python -m playwright install chromium
      - run: choco install ffmpeg --no-progress -y
      - run: python -m pip wheel . --no-deps -w dist
      - name: Build hash-pinned Windows deployment bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .streamops/node-deployment/wheelhouse | Out-Null
          Copy-Item dist/*.whl .streamops/node-deployment/wheelhouse/
          python -m pip download --only-binary=:all: --dest .streamops/node-deployment/wheelhouse `
            fastapi pillow uvicorn websockets PyYAML 'dxcam[winrt]'
          python scripts/release/streamops_node_bundle.py pack `
            --root .streamops/node-deployment --source-commit "${{ github.event.pull_request.head.sha || github.sha }}"
          python scripts/release/streamops_node_bundle.py verify `
            --root .streamops/node-deployment --source-commit "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Test installed wheel outside source checkout
        shell: pwsh
        run: |
          $env:STREAMOPS_TEST_WHEEL = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          python -m pytest -q streamops/server/tests/test_wheel_acceptance.py
      - run: python -m pytest -q
      - name: Test D4Planner POC
        run: python -m pytest -q utility/d4planner/tests
      - name: Compile D4Planner POC
        run: python -m compileall -q utility/d4planner
      - name: Build D4Planner NVDA add-on
        run: python utility/d4planner/tools/build_nvda_addon.py
      - uses: actions/upload-artifact@v4
        with:
          name: d4planner-nvda-addon
          path: utility/d4planner/dist/*.nvda-addon
      - uses: actions/upload-artifact@v4
        with:
          name: streamops-node-deployment-${{ github.event.pull_request.head.sha || github.sha }}
          path: .streamops/node-deployment/**
          if-no-files-found: error
