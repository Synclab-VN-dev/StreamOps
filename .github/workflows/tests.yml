name: Tests
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detect changed components
        id: changes
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            "d4planner=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "server=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          $base = "${{ github.event.pull_request.base.sha }}"
          $head = "${{ github.event.pull_request.head.sha }}"
          $files = @(git diff --name-only "$base...$head")
          $realFiles = @(
            $files | Where-Object { $_ -ne ".github/workflows/tests.yml" }
          )

          if ($realFiles.Count -eq 0) {
            # A workflow-only change validates both branches of this workflow.
            $d4planner = $true
            $server = $true
          } else {
            # Overlay POC requires REAL regression of both independent
            # Python contexts, not a green job containing only skipped steps.
            $overlay = @(
              $realFiles | Where-Object {
                $_ -like "utility/d4planner-overlay-poc/*" -or
                $_ -like "scripts/*/d4-overlay-poc*" -or
                $_ -eq ".github/workflows/d4-overlay-poc.yml"
              }
            ).Count -gt 0
            $d4planner = $overlay -or (@(
              $realFiles | Where-Object { $_ -like "utility/d4planner/*" }
            ).Count -gt 0)
            $server = $overlay -or (@(
              $realFiles | Where-Object {
                $_ -like "streamops/*" -or $_ -eq "pyproject.toml"
              }
            ).Count -gt 0)
          }

          "d4planner=$($d4planner.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "server=$($server.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          Write-Host "Changed files:"
          $files | ForEach-Object { Write-Host "  $_" }
          Write-Host "D4Planner tests: $d4planner"
          Write-Host "Server tests: $server"

      - name: Install D4Planner dev dependencies
        if: steps.changes.outputs.d4planner == 'true'
        run: python -m pip install -e 'utility/d4planner[dev]'
      - name: Test D4Planner runtime
        if: steps.changes.outputs.d4planner == 'true'
        run: python -m pytest -q utility/d4planner/tests
      - name: Compile D4Planner runtime
        if: steps.changes.outputs.d4planner == 'true'
        run: python -m compileall -q utility/d4planner
      - name: Build D4Planner NVDA add-on
        if: steps.changes.outputs.d4planner == 'true'
        run: python utility/d4planner/tools/build_nvda_addon.py
      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.d4planner == 'true'
        with:
          name: d4planner-nvda-addon
          path: utility/d4planner/dist/*.nvda-addon

      - name: Install StreamOps server dependencies
        if: steps.changes.outputs.server == 'true'
        run: python -m pip install '.[server,dev]'
      - name: Install Playwright Chromium
        if: steps.changes.outputs.server == 'true'
        run: python -m playwright install chromium
      - name: Install verified FFmpeg binaries (required for media E2E)
        if: steps.changes.outputs.server == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Chocolatey may report exit 0 on HTTP 503/package resolution failure.
          # Never let E2E media tests silently skip because ffmpeg is missing.
          choco install ffmpeg --no-progress -y | Out-Host

          $ffmpeg = Get-Command ffmpeg -ErrorAction SilentlyContinue
          $ffprobe = Get-Command ffprobe -ErrorAction SilentlyContinue
          if (-not $ffmpeg -or -not $ffprobe) {
            Write-Host 'Chocolatey binaries unavailable; using verified Windows essentials build.'
            $origin = 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
            $archive = Join-Path $env:RUNNER_TEMP 'streamops-ffmpeg-essentials.zip'
            $destination = Join-Path $env:RUNNER_TEMP 'streamops-ffmpeg'
            $hashUrl = "$origin.sha256"
            $shaText = (Invoke-WebRequest -Uri $hashUrl -UseBasicParsing).Content
            $expectedHash = [regex]::Match([string]$shaText, '[a-fA-F0-9]{64}').Value
            if (-not $expectedHash) {
              throw "FFmpeg SHA-256 manifest unavailable: $hashUrl"
            }
            Invoke-WebRequest -Uri $origin -OutFile $archive -UseBasicParsing
            $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
            if ($actualHash -ne $expectedHash) {
              throw "FFmpeg SHA-256 mismatch; refusing to extract executable."
            }
            Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
            $exe = Get-ChildItem -Path $destination -Filter ffmpeg.exe -File -Recurse |
              Select-Object -First 1
            if (-not $exe) { throw 'FFmpeg Windows executable not found in verified archive.' }
            $bin = Split-Path -Parent $exe.FullName
            if (-not (Test-Path (Join-Path $bin 'ffprobe.exe'))) {
              throw 'ffprobe.exe missing from verified FFmpeg archive.'
            }
            $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH = "$bin;$env:PATH"
          }

          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or
              -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            throw 'FFmpeg and ffprobe are mandatory for StreamOps media E2E.'
          }
          & ffmpeg -hide_banner -version | Select-Object -First 1
          & ffprobe -hide_banner -version | Select-Object -First 1
      - name: Build StreamOps wheel
        if: steps.changes.outputs.server == 'true'
        run: python -m pip wheel . --no-deps -w dist
      - name: Test installed wheel outside source checkout
        if: steps.changes.outputs.server == 'true'
        shell: pwsh
        run: |
          $env:STREAMOPS_TEST_WHEEL = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          python -m pytest -q streamops/server/tests/test_wheel_acceptance.py
      - name: Test OBS Plugin Manager FE model (Node built-in test runner)
        if: steps.changes.outputs.server == 'true'
        run: node --test streamops/server/tests/issue75_core.test.mjs streamops/server/tests/issue75_store.test.mjs streamops/server/tests/issue75_extended_core.test.mjs streamops/server/tests/issue75_extended_store.test.mjs
      - name: Test StreamOps
        if: steps.changes.outputs.server == 'true'
        run: python -m pytest -q
