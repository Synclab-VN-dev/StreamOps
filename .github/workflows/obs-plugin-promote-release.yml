name: OBS Plugin - Promote reviewed Synclab release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing draft tag version (four numeric components)"
        type: string
        required: true
      expected_source_commit:
        description: "Exact 40-character StreamOps source commit in reviewed provenance"
        type: string
        required: true
      expected_zip_sha256:
        description: "Exact approved SHA-256 of the ZIP artifact"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: obs-plugin-managed-release
  cancel-in-progress: false

jobs:
  promote:
    name: Verify immutable draft and publish approved release
    if: github.ref == 'refs/heads/master' && github.repository == 'Synclab-VN-dev/StreamOps'
    runs-on: ubuntu-24.04
    environment: obs-plugin-release
    timeout-minutes: 15
    env:
      RELEASE_REPO: Synclab-VN-dev/StreamOps-OBS-Plugins
      GH_TOKEN: ${{ secrets.SYNCLAB_OBS_RELEASE_TOKEN }}
      EXPECTED_VERSION: ${{ inputs.version }}
      EXPECTED_COMMIT: ${{ inputs.expected_source_commit }}
      EXPECTED_ZIP_SHA: ${{ inputs.expected_zip_sha256 }}
    steps:
      - name: Checkout source verifier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source identity and manifest inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version" >&2; exit 1; }
          [[ "$EXPECTED_COMMIT" =~ ^[a-f0-9]{40}$ ]] || { echo "Invalid source commit" >&2; exit 1; }
          [[ "$EXPECTED_ZIP_SHA" =~ ^[a-f0-9]{64}$ ]] || { echo "Invalid ZIP hash" >&2; exit 1; }
          git cat-file -e "$EXPECTED_COMMIT^{commit}" || { echo "Source commit not reachable" >&2; exit 1; }
          test -n "$GH_TOKEN" || { echo "SYNCLAB_OBS_RELEASE_TOKEN missing" >&2; exit 1; }

      - name: Read and download existing draft only
        shell: bash
        run: |
          set -euo pipefail
          tag="obs-multi-rtmp/v$EXPECTED_VERSION"
          test "$(gh release view "$tag" --repo "$RELEASE_REPO" --json isDraft --jq .isDraft)" = "true" || {
            echo "Expected a reviewed draft release (not an already-published release)." >&2; exit 1;
          }
          mkdir -p .streamops/reviewed-release
          gh release download "$tag" --repo "$RELEASE_REPO" \
            --dir .streamops/reviewed-release \
            --pattern "obs-multi-rtmp-$EXPECTED_VERSION-windows-x64.zip" \
            --pattern "obs-multi-rtmp.release.json" \
            --pattern "obs-multi-rtmp.provenance.json" \
            --pattern "LICENSE-GPL-2.0.txt"

      - name: Verify exact draft assets against reviewer SHA and provenance
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release/obs_plugin_package.py verify \
            --output-dir .streamops/reviewed-release \
            --require-approved --expected-version "$EXPECTED_VERSION" \
            --expected-commit "$EXPECTED_COMMIT"
          actual_sha="$(sha256sum ".streamops/reviewed-release/obs-multi-rtmp-$EXPECTED_VERSION-windows-x64.zip" | cut -d ' ' -f1)"
          test "$actual_sha" = "$EXPECTED_ZIP_SHA" || { echo "Approval ZIP SHA differs from draft asset!" >&2; exit 1; }
          file_count="$(find .streamops/reviewed-release -maxdepth 1 -type f | wc -l)"
          test "$file_count" = "4" || { echo "Draft has an unexpected asset count" >&2; exit 1; }

      - name: Publish existing draft (no rebuilding or asset mutation)
        shell: bash
        run: |
          set -euo pipefail
          tag="obs-multi-rtmp/v$EXPECTED_VERSION"
          gh release edit "$tag" --repo "$RELEASE_REPO" --draft=false
          test "$(gh release view "$tag" --repo "$RELEASE_REPO" --json isDraft --jq .isDraft)" = "false"
          echo "RELEASE_PUBLISHED=$tag" >> "$GITHUB_STEP_SUMMARY"
          echo "Approved SHA256=$EXPECTED_ZIP_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Source=$EXPECTED_COMMIT" >> "$GITHUB_STEP_SUMMARY"
