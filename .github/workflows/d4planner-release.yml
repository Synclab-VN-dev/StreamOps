name: D4Planner Release
on:
  push:
    tags:
      - "d4planner-uat/v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Candidate version X.Y.Z'
        required: true
        type: string
      build_only:
        description: 'Build verified Setup without creating a Release'
        required: true
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: d4planner-release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      setup_sha256: ${{ steps.build.outputs.setup_sha256 }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ github.sha }}
      D4_BUILD_ONLY: ${{ inputs.build_only }}
      RELEASE_CHANNEL: ${{ github.event_name == 'push' && 'uat' || 'stable' }}
      GH_TOKEN: ${{ github.token }}
      D4_DISTRIBUTION_APPROVAL: ${{ secrets.D4PLANNER_DISTRIBUTION_APPROVAL_JSON }}
      D4_PUBLIC_RUNTIME_INPUT_URL: ${{ secrets.D4PLANNER_PUBLIC_RUNTIME_INPUTS_URL }}
      D4_PUBLIC_RUNTIME_INPUT_SHA256: ${{ secrets.D4PLANNER_PUBLIC_RUNTIME_INPUTS_SHA256 }}
    steps:
      - name: Preserve exact LF execution bytes in the Windows checkout
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Resolve UAT tag version without default-branch dispatch
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $v = (Get-Content utility/d4planner/d4planner-be/release1/package-plan.json -Raw | ConvertFrom-Json).version
          if ($v -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Invalid UAT version' }
          "RELEASE_VERSION=$v" >> $env:GITHUB_ENV
      - name: Validate source, version, distribution and protected publish gate
        shell: pwsh
        run: |
          python utility/d4planner/d4planner-be/tools/release_ci.py validate --channel "$env:RELEASE_CHANNEL" --version "$env:RELEASE_VERSION" --source "$env:SOURCE_SHA" --directory "$env:RUNNER_TEMP/d4-release"
          if ($LASTEXITCODE -ne 0) { throw 'Release validation failed closed' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.1'
      - name: Restrict build staging to runner identity
        shell: pwsh
        run: |
          $owned = Join-Path $env:RUNNER_TEMP 'd4-release'
          New-Item -ItemType Directory -Force $owned | Out-Null
          $account = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          & icacls $owned /inheritance:r /grant:r "${account}:(OI)(CI)F" 'SYSTEM:(OI)(CI)F'
          if ($LASTEXITCODE -ne 0) { throw 'Private build ACL failed' }
      - name: Prepare pinned build tools
        shell: pwsh
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust unavailable' }
          "RUSTUP_TOOLCHAIN=1.90.0" >> $env:GITHUB_ENV
          python -m pip install setuptools==80.9.0 wheel==0.45.1 pytest==9.1.1 -r utility/d4planner/d4planner-be/release1/requirements-release.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned build dependencies unavailable' }
      - name: Build and verify complete production Setup
        id: build
        shell: pwsh
        run: |
          python utility/d4planner/d4planner-be/tools/release_ci.py build --channel "$env:RELEASE_CHANNEL" --version "$env:RELEASE_VERSION" --source "$env:SOURCE_SHA" --directory "$env:RUNNER_TEMP/d4-release"
          if ($LASTEXITCODE -ne 0) { throw 'Production package build/health failed' }
      - name: Verify plaintext redistribution before any upload
        shell: pwsh
        env:
          D4_BUILT_SETUP_SHA256: ${{ steps.build.outputs.setup_sha256 }}
        run: |
          python utility/d4planner/d4planner-be/tools/release_ci.py prepare-upload --channel "$env:RELEASE_CHANNEL" --version "$env:RELEASE_VERSION" --source "$env:SOURCE_SHA" --directory "$env:RUNNER_TEMP/d4-release/build/verified-artifact"
          if ($LASTEXITCODE -ne 0) { throw 'Plaintext distribution not approved; no upload' }
          python utility/d4planner/d4planner-be/tools/release_ci.py validate-upload --channel "$env:RELEASE_CHANNEL" --version "$env:RELEASE_VERSION" --source "$env:SOURCE_SHA" --directory "$env:RUNNER_TEMP/d4-release/build/verified-artifact"
          if ($LASTEXITCODE -ne 0) { throw 'Public artifact validation failed closed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: D4Planner-Setup-${{ env.RELEASE_VERSION }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/d4-release/build/verified-artifact/D4Planner-Setup-${{ env.RELEASE_VERSION }}.exe
            ${{ runner.temp }}/d4-release/build/verified-artifact/release-metadata.json
            ${{ runner.temp }}/d4-release/build/verified-artifact/SHA256SUMS
            ${{ runner.temp }}/d4-release/build/verified-artifact/UAT.md
          if-no-files-found: error
          retention-days: 7
      - name: Remove plaintext runtime and Setup staging
        if: always()
        shell: pwsh
        run: |
          $owned = Join-Path $env:RUNNER_TEMP 'd4-release'
          if (Test-Path $owned) { Remove-Item -LiteralPath $owned -Recurse -Force }
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.build_only }}
    needs: build
    runs-on: windows-2022
    timeout-minutes: 15
    environment: d4planner-release
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_CHANNEL: ${{ github.event_name == 'push' && 'uat' || 'stable' }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ github.sha }}
      D4_BUILT_SETUP_SHA256: ${{ needs.build.outputs.setup_sha256 }}
      D4_DISTRIBUTION_APPROVAL: ${{ secrets.D4PLANNER_DISTRIBUTION_APPROVAL_JSON }}
      D4_RELEASE_GATES: ${{ secrets.D4PLANNER_RELEASE_GATES_JSON }}
    steps:
      - name: Preserve exact LF execution bytes in the Windows checkout
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: verified-artifact
          merge-multiple: true
      - name: Verify approval, original artifact, release gates and publish once
        shell: pwsh
        run: |
          python utility/d4planner/d4planner-be/tools/release_ci.py publish --version "$env:RELEASE_VERSION" --source "$env:SOURCE_SHA" --directory verified-artifact
          if ($LASTEXITCODE -ne 0) { throw 'Release was not authorized or failed closed' }

  publish-uat:
    if: github.event_name == 'push'
    needs: build
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.sha }}
      D4_BUILT_SETUP_SHA256: ${{ needs.build.outputs.setup_sha256 }}
      D4_UAT_RELEASE_APPROVAL: ${{ secrets.D4PLANNER_UAT_RELEASE_APPROVAL_JSON }}
      D4_DISTRIBUTION_APPROVAL: ${{ secrets.D4PLANNER_DISTRIBUTION_APPROVAL_JSON }}
    steps:
      - name: Preserve exact LF execution bytes in the Windows checkout
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: verified-artifact
          merge-multiple: true
      - name: Publish original verified UAT Setup only
        shell: pwsh
        run: |
          $v = (Get-Content utility/d4planner/d4planner-be/release1/package-plan.json -Raw | ConvertFrom-Json).version
          python utility/d4planner/d4planner-be/tools/release_ci.py publish-uat --channel uat --version "$v" --source "$env:SOURCE_SHA" --directory verified-artifact
          if ($LASTEXITCODE -ne 0) { throw 'UAT publication failed closed' }
