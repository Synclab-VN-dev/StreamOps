name: D4Planner Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Candidate version X.Y.Z'
        required: true
        type: string
      build_only:
        description: 'Build verified Setup without creating a Release'
        required: true
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: d4planner-release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      setup_sha256: ${{ steps.build.outputs.setup_sha256 }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ github.sha }}
      D4_BUILD_ONLY: ${{ inputs.build_only }}
      GH_TOKEN: ${{ github.token }}
      D4_DISTRIBUTION_APPROVAL: ${{ secrets.D4PLANNER_DISTRIBUTION_APPROVAL_JSON }}
      D4_PUBLIC_RUNTIME_INPUT_URL: ${{ secrets.D4PLANNER_PUBLIC_RUNTIME_INPUTS_URL }}
      D4_PUBLIC_RUNTIME_INPUT_SHA256: ${{ secrets.D4PLANNER_PUBLIC_RUNTIME_INPUTS_SHA256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Validate source, version, distribution and protected publish gate
        shell: pwsh
        run: |
          python utility/d4planner/tools/release_ci.py validate --version "$env:RELEASE_VERSION" --source "$env:SOURCE_SHA" --directory "$env:RUNNER_TEMP/d4-release"
          if ($LASTEXITCODE -ne 0) { throw 'Release validation failed closed' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.1'
      - name: Prepare pinned build tools
        shell: pwsh
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust unavailable' }
          "RUSTUP_TOOLCHAIN=1.90.0" >> $env:GITHUB_ENV
          python -m pip install setuptools==80.9.0 wheel==0.45.1 pytest==9.1.1 -r utility/d4planner/release1/requirements-release.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned build dependencies unavailable' }
      - name: Build and verify complete production Setup
        id: build
        shell: pwsh
        run: |
          python utility/d4planner/tools/release_ci.py build --version "$env:RELEASE_VERSION" --source "$env:SOURCE_SHA" --directory "$env:RUNNER_TEMP/d4-release"
          if ($LASTEXITCODE -ne 0) { throw 'Production package build/health failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: D4Planner-Setup-${{ inputs.version }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/d4-release/build/verified-artifact/D4Planner-Setup-${{ inputs.version }}.exe
            ${{ runner.temp }}/d4-release/build/verified-artifact/release-metadata.json
            ${{ runner.temp }}/d4-release/build/verified-artifact/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
  publish:
    if: ${{ !inputs.build_only }}
    needs: build
    runs-on: windows-2022
    timeout-minutes: 15
    environment: d4planner-release
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ github.sha }}
      D4_BUILT_SETUP_SHA256: ${{ needs.build.outputs.setup_sha256 }}
      D4_DISTRIBUTION_APPROVAL: ${{ secrets.D4PLANNER_DISTRIBUTION_APPROVAL_JSON }}
      D4_RELEASE_GATES: ${{ secrets.D4PLANNER_RELEASE_GATES_JSON }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: verified-artifact
          merge-multiple: true
      - name: Verify approval, original artifact, release gates and publish once
        shell: pwsh
        run: |
          python utility/d4planner/tools/release_ci.py publish --version "$env:RELEASE_VERSION" --source "$env:SOURCE_SHA" --directory verified-artifact
          if ($LASTEXITCODE -ne 0) { throw 'Release was not authorized or failed closed' }
