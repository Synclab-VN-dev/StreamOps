name: D4 Maxroll Capture Contract (Issue 106)
on:
  pull_request:
    paths:
      - 'utility/d4-maxroll-reference/**'
      - '.github/workflows/d4-maxroll-reference.yml'
  workflow_dispatch:
jobs:
  candidate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate synthetic candidate (not a golden)
        run: python utility/d4-maxroll-reference/check.py utility/d4-maxroll-reference/examples-synthetic.json --report artifacts/d4-maxroll-candidate.json
      - name: Negative and integrity tests
        run: python -m unittest discover -s utility/d4-maxroll-reference/tests -p 'test_*.py' -v
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d4-maxroll-reference-contract-evidence
          path: artifacts/d4-maxroll-candidate.json
