name: D4 Rule Kit Encrypted Offline Fixture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encrypted-fixture-offline:
    name: Pinned encrypted fixture integrity (offline runtime blocked by patch drift)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: maxroll-fixture-trusted
    defaults:
      run:
        working-directory: utility/d4-rulekit/providers/maxroll
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: utility/d4-rulekit/providers/maxroll/package-lock.json

      - name: Install pinned provider dependencies
        run: npm ci

      - name: Install verified age v1.3.2 binary
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/age-v1.3.2-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          echo 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  '"$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          chmod 700 "$RUNNER_TEMP/age/age"
          echo "AGE_BIN=$RUNNER_TEMP/age/age" >> "$GITHUB_ENV"

      - name: Download exact immutable encrypted fixture release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/encrypted-fixture"
          gh release download 'test-fixture/enc-e2e-20261023-r01' \
            --repo '${{ github.repository }}' --dir "$RUNNER_TEMP/encrypted-fixture" \
            --pattern 'ci-data-pack-20261023-r01.zip.age' \
            --pattern 'ci-data-pack-20261023-r01.zip.age.sha256'

      - name: Materialize age identity without logging it
        shell: bash
        env:
          AGE_IDENTITY_SECRET: ${{ secrets.MAXROLL_FIXTURE_AGE_IDENTITY }}
        run: |
          set -euo pipefail
          if [[ -z "$AGE_IDENTITY_SECRET" ]]; then
            echo '::error::BLOCKED_KEY_PROVISIONING: MAXROLL_FIXTURE_AGE_IDENTITY is missing'
            exit 1
          fi
          umask 077
          printf '%s' "$AGE_IDENTITY_SECRET" > "$RUNNER_TEMP/fixture-identity.txt"
          echo "AGE_IDENTITY_FILE=$RUNNER_TEMP/fixture-identity.txt" >> "$GITHUB_ENV"

      - name: Download, decrypt and verify pinned snapshot package
        shell: bash
        run: |
          set -euo pipefail
          npm run fixture:encrypted -- verify \
            --encrypted "$RUNNER_TEMP/encrypted-fixture/ci-data-pack-20261023-r01.zip.age" \
            --checksum "$RUNNER_TEMP/encrypted-fixture/ci-data-pack-20261023-r01.zip.age.sha256" \
            --age-bin "$AGE_BIN" --identity "$AGE_IDENTITY_FILE"
          echo 'RUNTIME_COMPATIBILITY=PATCH_DRIFT'
          echo 'OFFLINE_E2E=NOT_RUN'

      - name: Cleanup decrypted identity and fixture files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/fixture-identity.txt"
          rm -rf "$RUNNER_TEMP/encrypted-fixture" "$RUNNER_TEMP/age"
