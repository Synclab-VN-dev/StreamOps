<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Steam Management · StreamOps</title>
    <link rel="stylesheet" href="/assets/app.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">StreamOps Node</a>
      <nav><a href="/">Dashboard</a></nav>
      <div class="node-status" aria-live="polite">
        <span id="status-dot" class="status-dot"></span><span id="status-text">Connecting</span>
      </div>
    </header>
    <main class="page-shell narrow-shell">
      <div class="page-heading"><div><p class="eyebrow">Management</p><h1>Steam</h1><p>Inspect the live Steam process and restart it in Big Picture Mode.</p></div></div>
      <section class="panel" aria-labelledby="steam-status-title">
        <div class="panel-heading">
          <h2 id="steam-status-title">Steam Process Status</h2>
          <div class="card-status"><span id="steam-status-dot" class="status-dot"></span><span id="steam-state">Checking</span></div>
        </div>
        <dl class="status-list">
          <div><dt>PID</dt><dd id="steam-pid">--</dd></div>
          <div><dt>Started</dt><dd id="steam-started">--</dd></div>
          <div><dt>Uptime</dt><dd id="steam-uptime">--</dd></div>
          <div><dt>Windows Session</dt><dd id="steam-session">--</dd></div>
          <div><dt>Interactive</dt><dd id="steam-interactive">--</dd></div>
          <div><dt>Installation</dt><dd id="steam-installation">--</dd></div>
        </dl>
        <div class="action-row"><button id="restart-button" type="button" disabled>Restart in Big Picture</button></div>
        <p id="error-message" class="error-message" role="alert" hidden></p>
      </section>
      <section class="panel activity-panel" aria-labelledby="activity-title">
        <div class="panel-heading"><h2 id="activity-title">Activity Log</h2><span>Browser session only</span></div>
        <ol id="activity-log" class="activity-log" aria-live="polite"></ol>
      </section>
    </main>
    <script src="/assets/common.js" defer></script>
    <script src="/assets/steam.js" defer></script>
  </body>
</html>
