<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diablo IV camera frame</title>
  <style>
    :root {
      color-scheme: dark;
      --frame-crimson: #5b0f14;
      --frame-crimson-bright: #8f1d24;
      --frame-gold: #c8a15a;
      --frame-shadow: rgb(0 0 0 / 72%);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 456px;
      height: 267px;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    .frame {
      position: absolute;
      inset: 0;
      border: 4px solid var(--frame-crimson);
      box-shadow:
        inset 0 0 0 2px rgb(0 0 0 / 80%),
        inset 0 0 18px var(--frame-shadow),
        0 5px 14px var(--frame-shadow);
    }

    .frame::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 2px solid var(--frame-gold);
      box-shadow: 0 0 7px rgb(200 161 90 / 38%);
    }

    .frame::after {
      content: "";
      position: absolute;
      inset: 5px;
      border: 1px solid var(--frame-crimson-bright);
    }

    .corner {
      position: absolute;
      width: 34px;
      height: 34px;
      border-color: var(--frame-gold);
      filter: drop-shadow(0 0 3px rgb(200 161 90 / 45%));
    }

    .top-left {
      top: 3px;
      left: 3px;
      border-top: 4px solid;
      border-left: 4px solid;
    }

    .top-right {
      top: 3px;
      right: 3px;
      border-top: 4px solid;
      border-right: 4px solid;
    }

    .bottom-left {
      bottom: 3px;
      left: 3px;
      border-bottom: 4px solid;
      border-left: 4px solid;
    }

    .bottom-right {
      right: 3px;
      bottom: 3px;
      border-right: 4px solid;
      border-bottom: 4px solid;
    }
  </style>
</head>
<body>
  <div class="frame" aria-hidden="true"></div>
  <div class="corner top-left" aria-hidden="true"></div>
  <div class="corner top-right" aria-hidden="true"></div>
  <div class="corner bottom-left" aria-hidden="true"></div>
  <div class="corner bottom-right" aria-hidden="true"></div>
</body>
</html>
