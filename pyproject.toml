[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "streamops"
version = "0.1.0"
description = "Automation and control-plane tooling for the livestream OBS workflow."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0.3",
  "websockets>=17.1",
]

[project.optional-dependencies]
server = [
  "dxcam[winrt]>=0.3.0; sys_platform == 'win32'",
  "fastapi>=0.141.1",
  "pillow>=12.3.0",
  "uvicorn>=0.53.0",
]
dev = [
  "httpx2>=2.13.1",
  "playwright>=1.63.0",
  "pytest>=9.1.1",
  "pytest-playwright>=0.9.0",
]

[project.scripts]
streamops = "streamops.cli:main"
streamops-node = "streamops.server.main:main"

[tool.setuptools.packages.find]
include = ["streamops*"]

[tool.setuptools.package-data]
streamops = [
  "assets/obs/*.html",
  "config/scenes/*.yaml",
  "config/scene-templates/*.json",
  "docs/*.md",
  "server/web/*",
  "server/web/obs-plugins/*",
  "server/platform/windows/obs_plugin/*.json",
]

[tool.pytest.ini_options]
testpaths = ["streamops/tests", "streamops/server/tests"]
addopts = "-ra"
