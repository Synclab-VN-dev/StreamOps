[package]
name = "d4planner-hud"
version = "0.1.0"
description = "D4Planner native Equipment HUD"
edition = "2021"
rust-version = "1.90"

[lib]
name = "d4planner_hud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
d4planner-runtime-logging = { path = "../runtime-logging" }
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wait-timeout = "0.2"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
