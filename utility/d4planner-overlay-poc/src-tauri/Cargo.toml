[package]
name = "d4planner-overlay-poc"
version = "0.1.0"
description = "Diablo IV transparent overlay feasibility POC"
edition = "2021"
rust-version = "1.90"

[lib]
name = "d4planner_overlay_poc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
