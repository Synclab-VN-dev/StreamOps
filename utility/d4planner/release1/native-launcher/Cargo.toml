[package]
name = "d4planner-launcher"
version = "1.0.0"
edition = "2021"
rust-version = "1.90"

[[bin]]
name = "D4Planner"
path = "src/main.rs"

[dependencies]
d4planner-runtime-logging = { path = "../../runtime-logging" }
serde_json = "1"
sha2 = "0.10"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
dunce = "=1.0.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
