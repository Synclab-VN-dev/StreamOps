[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "d4planner"
version = "0.1.0"
description = "Diablo IV accessibility capture POC for StreamOps."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
