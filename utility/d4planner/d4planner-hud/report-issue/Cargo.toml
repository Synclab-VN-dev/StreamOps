[package]
name = "d4planner-report-issue"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
[dependencies]
fs2 = "0.4.3"
d4planner-runtime-logging = { path = "../runtime-logging" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
age = { version = "=0.11.1", default-features = false }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
