[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "d4-rulekit"
version = "0.1.0"
description = "Versioned Diablo IV Rule DSL schema contract and syntax validation (G1 only)"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "build>=1.2"]

[project.scripts]
d4-rulekit = "d4_rulekit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"d4_rulekit.schemas" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
